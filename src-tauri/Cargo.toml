[package]
name = "hitsound-share"
version = "0.1.0"
description = "osu! hitsound 分享站桌面壳"
edition = "2021"

# 官方模板的 lib 三形态：桌面 rlib 之外连带 cdylib/staticlib，
# 预留将来移动端打包入口，桌面构建不引入额外成本
[lib]
name = "hitsound_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# opener：桌面登录转跳系统浏览器完成 osu! 授权（JS 侧 openUrl）——壳唯一插件
tauri-plugin-opener = "2"
# single-instance：深链热投递（应用已运行时 OS 拉起第二进程）转发给首个实例并退出，
# 登录在同一窗口内完成；无 DBus 的桌面环境自动降级为多实例（失败模式可接受）
tauri-plugin-single-instance = { version = "2", default-features = false }

[profile.release]
# WebKitGTK 下体积收益有限，默认优化级别换取更快的增量发布
opt-level = 2
